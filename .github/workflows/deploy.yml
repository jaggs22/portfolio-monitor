name: deploy
# Publishes the site and Worker to Cloudflare whenever the app or Worker changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# Without them the deploy step is skipped (not failed), so the job stays green if Cloudflare's own Git build is used instead.
on:
  push:
    branches: [main]
    paths: ["public/**", "worker/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: node test/engine.test.js && node test/fin.test.js && node test/worker.test.mjs
      - name: Install Wrangler 4 from package.json
        run: npm install --no-audit --no-fund
      - name: Deploy to Cloudflare (retries on rate limits)
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for wait in 0 45 90 180; do
            sleep "$wait"
            if npx wrangler deploy --config worker/wrangler.toml 2>&1 | tee deploy.log; test "${PIPESTATUS[0]}" -eq 0; then exit 0; fi
            if ! grep -qE "10429|Rate limited|429" deploy.log; then echo "Deploy failed for a reason other than rate limiting"; exit 1; fi
            echo "Cloudflare rate-limited the deploy; retrying"
          done
          exit 1
      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add the secrets (see the comment at the top of this file) or use Cloudflare's Git integration."
