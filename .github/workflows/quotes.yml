name: quotes
# Every 10 minutes through the US session (UTC 13:00 to 21:59 covers both daylight and standard time).
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: data-publish
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load current data branch
        run: scripts/fetch_data.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Quotes and intraday bars
        run: python -m pipeline.run quotes --out out
      - name: Publish
        run: scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
