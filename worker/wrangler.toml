name = "portfolio-monitor"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The PWA is served from ../public as static assets; /api/* is answered by the Worker first.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
# owner/repo of the GitHub repository whose `data` branch the Actions workflows publish to
REPO = "jaggs22/portfolio-monitor"
DATA_BRANCH = "data"

# Last rung of the chat ladder: Cloudflare Workers AI (no key; free daily allowance)
[ai]
binding = "AI"

# Shared daily ceilings for the chat (zero-cost guarantee). SQLite-backed Durable Objects are free on the Workers Free plan.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "ChatLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatLimits"]
